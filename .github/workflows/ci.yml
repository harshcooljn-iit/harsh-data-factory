name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS matches the primary dev toolchain: build with
          # warnings-as-errors (the `debug` preset).
          - name: macos-clang
            os: macos-14
            cc: clang
            cxx: clang++
            preset: debug
          # Linux validates portability + a second/third compiler. The
          # `release` preset does not treat warnings as errors, so a newer
          # compiler's extra pedantry cannot block CI.
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            preset: release
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config
          if [ "${{ matrix.cc }}" = "gcc-13" ]; then
            sudo apt-get install -y gcc-13 g++-13
          fi

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Integration tests
        run: ctest --preset ${{ matrix.preset }} -L integration --output-on-failure

      - name: Install smoke test
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/_install"
          "$PWD/_install/bin/flowforge" version

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: scripts/format.sh --check
